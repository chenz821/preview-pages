<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测评编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --sub: #86868b;
    --line: #e5e5ea;
    --field: #f5f5f7;
    --accent: #0071e3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  .topbar { height: 48px; background: rgba(255,255,255,.85); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; }
  .logo { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .actions { display: flex; gap: 8px; }
  .btn { padding: 5px 14px; border-radius: 980px; border: none; cursor: pointer; font-size: 13px; background: #e8e8ed; color: var(--text); transition: opacity .15s; }
  .btn:hover { opacity: .8; }
  .btn.primary { background: var(--accent); color: #fff; }
  .main { display: flex; height: calc(100vh - 48px); }
  .pane { width: 50%; height: 100%; }
  .pane.editor { border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--bg); }

  /* ===== 文章信息卡片 ===== */
  .info-card { background: var(--card); border-bottom: 1px solid var(--line); padding: 18px 22px 16px; }
  .info-title { font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: .03em; margin-bottom: 14px; }
  .info-row { display: flex; gap: 14px; margin-bottom: 12px; }
  .info-row:last-child { margin-bottom: 0; }
  .avatar-pick { position: relative; width: 52px; height: 52px; border-radius: 14px; overflow: hidden; background: var(--field); flex-shrink: 0; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  .avatar-pick img, .avatar-pick .fallback { width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #5b8def, #8f6cf0); }
  .avatar-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .avatar-hint { font-size: 11px; color: var(--sub); text-align: center; margin-top: 4px; }
  .field { flex: 1; }
  .field label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 5px; }
  .field input { width: 100%; border: 1px solid transparent; background: var(--field); border-radius: 9px; padding: 8px 12px; font-size: 13.5px; outline: none; transition: border-color .15s, box-shadow .15s; color: var(--text); }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,.12); background: #fff; }
  .info-col { display: flex; gap: 14px; }
  .info-col .field { flex: 1; }

  .pane-label { height: 28px; background: var(--bg); display: flex; align-items: center; padding: 0 16px; font-size: 11px; color: var(--sub); border-bottom: 1px solid var(--line); letter-spacing: .02em; }
  textarea { flex: 1; border: none; outline: none; resize: none; padding: 20px 22px; font-size: 14px; line-height: 1.85; font-family: ui-monospace, SFMono-Regular, Consolas, "PingFang SC", monospace; background: #fff; color: #333; }

  .pane.preview { overflow-y: auto; background: var(--bg); padding: 32px 24px; }
  .note { max-width: 620px; margin: 0 auto; background: var(--card); border-radius: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.05); overflow: hidden; position: relative; }
  .note-head { display: flex; align-items: center; gap: 16px; padding: 28px 32px 20px; border-bottom: 1px solid var(--line); }
  .avatar-lg { width: 64px; height: 64px; border-radius: 22%; overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-lg .fb { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #5b8def, #8f6cf0); }
  .note-who { flex: 1; }
  .note-who .author { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .note-who .time { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .follow { font-size: 13px; font-weight: 600; color: #fff; background: var(--accent); border-radius: 980px; padding: 6px 18px; }
  .note-body { padding: 26px 32px 40px; }
  .note-body h1 { font-size: 25px; line-height: 1.35; margin: 0 0 18px; letter-spacing: -.015em; }
  .note-body h2 { font-size: 19px; margin: 30px 0 10px; letter-spacing: -.01em; }
  .note-body h3 { font-size: 16px; margin: 22px 0 8px; }
  .note-body p { margin: 10px 0; font-size: 15px; line-height: 1.9; color: #333; }
  .note-body strong { color: var(--text); font-weight: 600; }
  .note-body blockquote { border-left: 3px solid var(--line); margin: 14px 0; padding: 4px 16px; color: var(--sub); }
  .note-body ul, .note-body ol { margin: 10px 0 10px 26px; }
  .note-body li { margin: 5px 0; font-size: 15px; line-height: 1.8; color: #333; }
  .note-body code { background: #f2f2f4; padding: 2px 6px; border-radius: 6px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
  .note-body img { max-width: 100%; border-radius: 14px; display: block; margin: 18px auto; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .note-body hr { border: none; border-top: 1px solid var(--line); margin: 28px 0; }
  .wm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; user-select: none; z-index: 2; }
  .wm span { font-size: 30px; font-weight: 700; color: rgba(0,0,0,.09); letter-spacing: .15em; transform: rotate(-28deg); white-space: nowrap; padding: 10px 30px; border: 2px solid rgba(0,0,0,.07); border-radius: 8px; }
  .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(29,29,31,.85); color: #fff; padding: 8px 18px; border-radius: 12px; font-size: 13px; z-index: 1000; display: none; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">测评编辑器</div>
  <div class="actions">
    <button class="btn" onclick="loadSample()">示例</button>
    <button class="btn" onclick="copyMd()">复制 Markdown</button>
    <button class="btn primary" onclick="exportMd()">导出 .md</button>
  </div>
</div>
<div class="main">
  <div class="pane editor">
    <div class="info-card">
      <div class="info-title">文章信息</div>
      <div class="info-row">
        <div style="flex-shrink:0">
          <label class="avatar-pick">
            <span class="fallback" id="avatarFallback">文</span>
            <img id="avatarImg" alt="" style="display:none">
            <input type="file" id="avatarFile" accept="image/*">
          </label>
          <div class="avatar-hint">点击上传头像</div>
        </div>
        <div class="field">
          <label for="author">作者</label>
          <input id="author" placeholder="作者名">
        </div>
      </div>
      <div class="info-col">
        <div class="field">
          <label for="date">时间</label>
          <input id="date" placeholder="2026-09-14">
        </div>
        <div class="field">
          <label for="watermark">水印</label>
          <input id="watermark" placeholder="@作者名">
        </div>
      </div>
    </div>
    <div class="pane-label">Markdown</div>
    <textarea id="mdInput" spellcheck="false"></textarea>
  </div>
  <div class="pane preview">
    <div class="pane-label">预览</div>
    <div id="previewArea"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_MD = `# 囤了几千张图的我，被这个工具一天治好

**值得装吗：值得，尤其适合图片重度用户。** **推荐指数：★★★★☆**

---

先说说我的病：手机截图、网页存图、设计稿，乱七八糟几千张，找图全靠翻，整理全靠缘分。

![登录界面](https://pro-test-1447692853.cos.ap-guangzhou.myqcloud.com/images/img-01.jpeg)

重头戏是批量重命名，它不是"按 F2 一个个改"，而是规则化批量重命名，选中一堆文件右键 → 重命名，确认前就能看到最终文件名。

![重命名序列规则预览](https://pro-test-1447692853.cos.ap-guangzhou.myqcloud.com/images/img-07.png)

槽点也真实：文件去重有误删风险、会员不便宜。`;

marked.setOptions({ breaks: true, gfm: true });

function render() {
  const md = document.getElementById("mdInput").value;
  const author = document.getElementById("author").value.trim() || "作者";
  const date = document.getElementById("date").value.trim();
  const wm = document.getElementById("watermark").value.trim();
  const avatarImg = document.getElementById("avatarImg");

  let head;
  if (avatarImg.src && avatarImg.style.display !== "none") {
    head = `<div class="avatar-lg"><img src="${avatarImg.src}" alt=""></div>`;
  } else {
    head = `<div class="avatar-lg"><span class="fb">${author[0] || "文"}</span></div>`;
  }
  const timeHtml = date ? `<div class="time">${date}</div>` : "";
  const wmHtml = wm ? `<div class="wm"><span>${escapeHtml(wm)}</span></div>` : "";

  document.getElementById("previewArea").innerHTML =
    `<div class="note">` +
    `<div class="note-head">${head}<div class="note-who"><div class="author">${escapeHtml(author)}</div>${timeHtml}</div><div class="follow">关注</div></div>` +
    `<div class="note-body">${marked.parse(md)}</div>${wmHtml}` +
    `</div>`;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 1800);
}

document.getElementById("avatarFile").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    document.getElementById("avatarImg").src = ev.target.result;
    document.getElementById("avatarImg").style.display = "block";
    document.getElementById("avatarFallback").style.display = "none";
    render();
    toast("头像已从本地载入");
  };
  reader.readAsDataURL(file);
});

function loadSample() {
  document.getElementById("mdInput").value = DEFAULT_MD;
  document.getElementById("author").value = "小编";
  document.getElementById("date").value = "2026-09-14";
  document.getElementById("watermark").value = "@小编";
  render();
}

function copyMd() {
  navigator.clipboard.writeText(document.getElementById("mdInput").value)
    .then(() => toast("Markdown 已复制"));
}

function exportMd() {
  const blob = new Blob([document.getElementById("mdInput").value], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "测评.md";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出 .md，可交给 AI 生成分享页");
}

document.getElementById("mdInput").addEventListener("input", render);
["author", "date", "watermark"].forEach(id =>
  document.getElementById(id).addEventListener("input", render));

loadSample();
</script>
</body>
</html>
