<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --sub: #86868b;
    --line: #e5e5ea;
    --field: #f5f5f7;
    --accent: #0071e3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  .topbar { height: 48px; background: rgba(255,255,255,.85); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; }
  .logo { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; background: #e8e8ed; border-radius: 980px; padding: 2px; }
  .seg button { border: none; background: transparent; padding: 4px 14px; border-radius: 980px; font-size: 12.5px; cursor: pointer; color: var(--sub); transition: all .15s; }
  .seg button.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn { padding: 5px 14px; border-radius: 980px; border: none; cursor: pointer; font-size: 13px; background: #e8e8ed; color: var(--text); transition: opacity .15s; }
  .btn:hover { opacity: .8; }
  .btn.primary { background: var(--accent); color: #fff; }
  .main { display: flex; height: calc(100vh - 48px); }
  .pane { width: 50%; height: 100%; }
  .pane.editor { border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--bg); }

  /* ===== 文章信息卡片（重构） ===== */
  .info-card { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 22px; }
  .info-title { font-size: 11px; font-weight: 600; color: var(--sub); letter-spacing: .05em; margin-bottom: 12px; }
  .info-main { display: flex; gap: 18px; align-items: center; }
  .avatar-wrap { flex-shrink: 0; text-align: center; }
  .avatar-pick { position: relative; display: block; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: var(--field); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  .avatar-pick .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #5b8def, #8f6cf0); }
  .avatar-pick img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: cover; display: none; }
  .avatar-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 3; }
  .avatar-pick .mask { position: absolute; inset: 0; background: rgba(0,0,0,.35); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s; z-index: 2; pointer-events: none; }
  .avatar-pick:hover .mask { opacity: 1; }
  .avatar-label { font-size: 11px; color: var(--sub); margin-top: 6px; }
  .info-fields { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .field label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  .field input { width: 100%; border: 1px solid transparent; background: var(--field); border-radius: 9px; padding: 7px 12px; font-size: 13.5px; outline: none; transition: border-color .15s, box-shadow .15s, background .15s; color: var(--text); }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,.12); background: #fff; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; min-width: 0; }

  .pane-label { height: 28px; background: var(--bg); display: flex; align-items: center; padding: 0 16px; font-size: 11px; color: var(--sub); border-bottom: 1px solid var(--line); letter-spacing: .02em; }
  textarea { flex: 1; border: none; outline: none; resize: none; padding: 20px 22px; font-size: 14px; line-height: 1.85; font-family: ui-monospace, SFMono-Regular, Consolas, "PingFang SC", monospace; background: #fff; color: #333; }

  .pane.preview { overflow-y: auto; background: var(--bg); padding: 32px 24px; }
  .note { max-width: 620px; margin: 0 auto; background: var(--card); border-radius: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.05); overflow: hidden; position: relative; }
  .note.mode-long { width: 440px; height: 587px; border-radius: 18px; margin: 0 auto 22px; display: flex; flex-direction: column; }
  .mode-long .note-head { flex-shrink: 0; }
  .mode-long .note-body { flex: 1; overflow: hidden; padding: 16px 22px 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .mode-long .note-body > * { flex-shrink: 0; }
  .mode-long .note-body h1 { font-size: 20px; margin-bottom: 10px; }
  .mode-long .note-body p, .mode-long .note-body li { font-size: 14px; }
  .mode-long .note-body img { max-width: 100%; max-height: 280px; height: auto; width: auto; display: block; margin: 10px auto; border-radius: 12px; }
  .mode-long .wm { flex-shrink: 0; padding: 10px 22px 12px; font-size: 11px; }
  .page-dots { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 9px; z-index: 20; }
  .page-dots span { width: 6px; height: 6px; border-radius: 50%; background: #d0d0d5; transition: background .15s; }
  .page-dots span.active { background: #1d1d1f; }
  .note-head { display: flex; align-items: center; gap: 12px; padding: 16px 24px 12px; border-bottom: 1px solid var(--line); overflow: hidden; }
  .avatar-lg { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; position: relative; padding: 2px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0,0,0,.08); }
  .avatar-lg img, .avatar-lg .fb { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); max-width: calc(100% - 4px); max-height: calc(100% - 4px); object-fit: cover; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #5b8def, #8f6cf0); }
  .note-who { flex: 1; min-width: 0; }
  .note-who .author { font-size: 15px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-who .id { font-size: 12px; color: var(--sub); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .follow { font-size: 12px; font-weight: 600; color: #ff2442; background: #fff; border: 1px solid #ff2442; border-radius: 980px; padding: 4px 14px; flex-shrink: 0; }
  .note-body { padding: 20px 24px 28px; }
  .note-body h1 { font-size: 25px; line-height: 1.35; margin: 0 0 18px; letter-spacing: -.015em; }
  .note-body h2 { font-size: 19px; margin: 30px 0 10px; letter-spacing: -.01em; }
  .note-body h3 { font-size: 16px; margin: 22px 0 8px; }
  .note-body p { margin: 10px 0; font-size: 15px; line-height: 1.9; color: #333; }
  .note-body strong { color: var(--text); font-weight: 600; }
  .note-body blockquote { border-left: 3px solid var(--line); margin: 14px 0; padding: 4px 16px; color: var(--sub); }
  .note-body ul, .note-body ol { margin: 10px 0 10px 26px; }
  .note-body li { margin: 5px 0; font-size: 15px; line-height: 1.8; color: #333; }
  .note-body code { background: #f2f2f4; padding: 2px 6px; border-radius: 6px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
  .note-body img { max-width: 100%; height: auto; border-radius: 14px; display: block; margin: 18px auto; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .note-body hr { border: none; border-top: 1px solid var(--line); margin: 28px 0; }
  .wm { padding: 0 24px 18px; font-size: 12px; color: rgba(0,0,0,.32); text-align: center; letter-spacing: .02em; user-select: none; }
  .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(29,29,31,.85); color: #fff; padding: 8px 18px; border-radius: 12px; font-size: 13px; z-index: 1000; display: none; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">测评编辑器</div>
  <div class="actions">
    <div class="seg" id="modeSeg">
      <button class="seg-btn active" data-mode="wide" onclick="setMode('wide')">长文</button>
      <button class="seg-btn" data-mode="long" onclick="setMode('long')">3:4 长图</button>
    </div>
    <button class="btn" onclick="loadSample()">示例</button>
    <button class="btn" onclick="copyMd()">复制 Markdown</button>
    <button class="btn primary" onclick="exportMd()">导出 .md</button>
  </div>
</div>
<div class="main">
  <div class="pane editor">
    <div class="info-card">
      <div class="info-title">文章信息</div>
      <div class="info-main">
        <div class="avatar-wrap">
          <label class="avatar-pick" id="avatarPick">
            <span class="fallback" id="avatarFallback">文</span>
            <img id="avatarImg" alt="">
            <span class="mask">更换</span>
            <input type="file" id="avatarFile" accept="image/*">
          </label>
          <div class="avatar-label" id="avatarLabel">头像</div>
        </div>
        <div class="info-fields">
          <div class="field">
            <label for="author">作者</label>
            <input id="author" placeholder="输入作者名">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="date">时间</label>
              <input id="date" placeholder="2026-09-14">
            </div>
            <div class="field">
              <label for="watermark">底部水印</label>
              <input id="watermark" placeholder="留空则不显示，如 @作者名">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="pane-label">Markdown</div>
    <textarea id="mdInput" spellcheck="false"></textarea>
  </div>
  <div class="pane preview">
    <div class="pane-label">预览</div>
    <div id="previewArea"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_MD = `# 囤了几千张图的我，被这个工具一天治好

**值得装吗：值得，尤其适合图片重度用户。** **推荐指数：★★★★☆**

---

先说说我的病：手机截图、网页存图、设计稿，乱七八糟几千张，找图全靠翻，整理全靠缘分。

![登录界面](https://pro-test-1447692853.cos.ap-guangzhou.myqcloud.com/images/img-01.jpeg)

重头戏是批量重命名，它不是"按 F2 一个个改"，而是规则化批量重命名，选中一堆文件右键 → 重命名，确认前就能看到最终文件名。

![重命名序列规则预览](https://pro-test-1447692853.cos.ap-guangzhou.myqcloud.com/images/img-07.png)

槽点也真实：文件去重有误删风险、会员不便宜。`;

marked.setOptions({ breaks: true, gfm: true });

let currentMode = "wide";
const PAGE_W = 440;
const PAGE_H = Math.round((PAGE_W * 4) / 3); // 587, 3:4

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".seg-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.mode === mode));
  render();
}

function renderHead(author, date) {
  const avatarImg = document.getElementById("avatarImg");
  let head;
  if (avatarImg.src && avatarImg.style.display !== "none") {
    head = `<div class="avatar-lg"><img src="${avatarImg.src}" alt=""></div>`;
  } else {
    head = `<div class="avatar-lg"><span class="fb">${author[0] || "文"}</span></div>`;
  }
  // 参考站风格副行：@作者名 · 时间（用户ID样式）
  const sub = "@" + author + (date ? " · " + date : "");
  const who = `<div class="note-who"><div class="author">${escapeHtml(author)}</div><div class="id">${escapeHtml(sub)}</div></div>`;
  return { head, who };
}

function renderWide() {
  const md = document.getElementById("mdInput").value;
  const author = document.getElementById("author").value.trim() || "作者";
  const date = document.getElementById("date").value.trim();
  const wm = document.getElementById("watermark").value.trim();
  const { head, who } = renderHead(author, date);
  const wmHtml = wm ? `<div class="wm">${escapeHtml(wm)}</div>` : "";
  document.getElementById("previewArea").innerHTML =
    `<div class="note">` +
    `<div class="note-head">${head}${who}<div class="follow">关注</div></div>` +
    `<div class="note-body">${marked.parse(md)}</div>` + wmHtml +
    `</div>`;
}

function renderLong() {
  const md = document.getElementById("mdInput").value;
  const author = document.getElementById("author").value.trim() || "作者";
  const date = document.getElementById("date").value.trim();
  const wm = document.getElementById("watermark").value.trim();
  const { head, who } = renderHead(author, date);
  const followHtml = `<div class="follow">关注</div>`;

  // 渲染内容到临时容器
  const probe = document.createElement("div");
  probe.style.cssText = `position:absolute;visibility:hidden;left:-9999px;top:0;width:${PAGE_W}px;font-size:15px;line-height:1.9;`;
  document.body.appendChild(probe);
  const wrap = document.createElement("div");
  wrap.style.cssText = `width:${PAGE_W}px;padding:16px 22px 12px;`;
  probe.appendChild(wrap);
  wrap.innerHTML = marked.parse(md);
  let items = Array.from(wrap.children);

  // 超长纯文本段落拆成小段：让文字填满空隙，图片换页时文字留在当前页
  function makeP(text) {
    const p = document.createElement("p");
    p.textContent = text;
    return p;
  }
  items = items.reduce((acc, el) => {
    const isPlain = el.tagName === "P" && el.children.length === 0 && el.textContent.length > 60;
    if (!isPlain) { acc.push(el); return acc; }
    const parts = el.textContent.match(/[^。！？!?\n]+[。！？!?]?/g) || [el.textContent];
    let buf = "";
    parts.forEach(p => {
      if ((buf + p).length > 90 && buf) { acc.push(makeP(buf)); buf = p; }
      else buf += p;
    });
    if (buf) acc.push(makeP(buf));
    return acc;
  }, []);

  // 等图片加载完再分页（否则高度算错）
  const imgs = wrap.querySelectorAll("img");
  const wait = Promise.all(Array.from(imgs).map(img =>
    img.complete ? Promise.resolve()
      : new Promise(res => { img.onload = img.onerror = res; })
  ));
  const timeout = new Promise(res => setTimeout(res, 2500));

  Promise.race([wait, timeout]).then(() => {
    // 插入式分页：逐元素放入真实页容器测量，杜绝估算误差
    const avail = PAGE_H - 33; // 预留水印空间（33px）
    const pages = [];
    let probePage = null;
    let bodyEl = null;
    let cur = { head: true, items: [] };
    pages.push(cur);

    function newProbe(withHead) {
      probePage = document.createElement("div");
      probePage.style.cssText = `position:absolute;visibility:hidden;left:-9999px;top:0;width:${PAGE_W}px;`;
      probePage.innerHTML = withHead
        ? `<div class="note-head">${head}${who}${followHtml}</div><div class="note-body" style="padding:16px 22px 12px;"></div>`
        : `<div class="note-body" style="padding:16px 22px 12px;"></div>`;
      document.body.appendChild(probePage);
      bodyEl = probePage.querySelector(".note-body");
    }

    newProbe(true);
    items.forEach(el => {
      bodyEl.appendChild(el);
      const after = probePage.offsetHeight;
      if (after > avail) {
        // 排满才断：超了就把这个元素推到下一页（图文自然流动，不绑定、不裁切）
        bodyEl.removeChild(el);
        document.body.removeChild(probePage);
        newProbe(false);
        bodyEl.appendChild(el);
        cur = { head: false, items: [] };
        pages.push(cur);
      }
      cur.items.push(el);
    });
    document.body.removeChild(probePage);

    // 生成多页卡片：每页底部水印
    let html = "";
    pages.forEach((pg) => {
      html += `<div class="note mode-long">`;
      if (pg.head) html += `<div class="note-head">${head}${who}${followHtml}</div>`;
      html += `<div class="note-body">${pg.items.map(e => e.outerHTML).join("")}</div>`;
      if (wm) html += `<div class="wm">${escapeHtml(wm)}</div>`;
      html += `</div>`;
    });

    // 右侧圆点分页指示器
    let dots = "";
    if (pages.length > 1) {
      dots = `<div class="page-dots">` +
        pages.map((_, i) => `<span class="${i === 0 ? "active" : ""}"></span>`).join("") +
        `</div>`;
    }
    document.getElementById("previewArea").innerHTML = html + dots;
  });
}

function render() {
  if (currentMode === "long") renderLong();
  else renderWide();
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 1800);
}

document.getElementById("avatarFile").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    const img = new Image();
    img.onload = function () {
      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const s = Math.min(img.width, img.height);
      const sx = (img.width - s) / 2;
      const sy = (img.height - s) / 2;
      ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      document.getElementById("avatarImg").src = dataUrl;
      document.getElementById("avatarImg").style.display = "block";
      document.getElementById("avatarFallback").style.display = "none";
      document.getElementById("avatarLabel").textContent = "点击更换";
      render();
      toast("头像已更新");
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function loadSample() {
  document.getElementById("mdInput").value = DEFAULT_MD;
  document.getElementById("author").value = "小编";
  document.getElementById("date").value = "2026-09-14";
  document.getElementById("watermark").value = "@小编";
  render();
}

function copyMd() {
  navigator.clipboard.writeText(document.getElementById("mdInput").value)
    .then(() => toast("Markdown 已复制"));
}

function exportMd() {
  const blob = new Blob([document.getElementById("mdInput").value], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "测评.md";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出 .md，可交给 AI 生成分享页");
}

document.getElementById("mdInput").addEventListener("input", render);
["author", "date", "watermark"].forEach(id =>
  document.getElementById(id).addEventListener("input", render));

loadSample();
</script>
</body>
</html>
