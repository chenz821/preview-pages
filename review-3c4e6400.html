<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布链路自检</title>
<meta name="description" content="发布链路自检">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1d1d1f; line-height: 1.8; padding: 36px 16px; }
  .note { max-width: 620px; margin: 0 auto; background: #fff; border-radius: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.05); overflow: hidden; position: relative; }
  .note-head { display: flex; align-items: center; gap: 12px; padding: 16px 24px 12px; border-bottom: 1px solid #e5e5ea; overflow: hidden; }
  .avatar-lg { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,.08); position: relative; }
  .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-lg .fb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #5b8def, #8f6cf0); }
  .note-who { flex: 1; }
  .note-who .author { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .note-who .time { font-size: 12px; color: #86868b; margin-top: 3px; }
  .note-body { padding: 20px 24px 28px; }
  .note-body h1 { font-size: 25px; line-height: 1.35; margin: 0 0 18px; letter-spacing: -.015em; }
  .note-body h2 { font-size: 19px; margin: 30px 0 10px; letter-spacing: -.01em; }
  .note-body h3 { font-size: 16px; margin: 22px 0 8px; }
  .note-body p { margin: 10px 0; font-size: 15px; line-height: 1.9; color: #333; word-break: break-word; }
  .note-body strong { color: #1d1d1f; font-weight: 600; }
  .note-body blockquote { border-left: 3px solid #e5e5ea; margin: 14px 0; padding: 4px 16px; color: #86868b; }
  .note-body ul, .note-body ol { margin: 10px 0 10px 26px; }
  .note-body li { margin: 5px 0; font-size: 15px; line-height: 1.8; color: #333; }
  .note-body code { background: #f2f2f4; padding: 2px 6px; border-radius: 6px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
  .note-body pre { background: #f2f2f4; padding: 14px 16px; border-radius: 10px; overflow-x: auto; margin: 14px 0; }
  .note-body pre code { background: none; padding: 0; }
  .note-body img { max-width: 100%; border-radius: 14px; display: block; margin: 18px auto; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .note-body hr { border: none; border-top: 1px solid #e5e5ea; margin: 28px 0; }
  .note-body table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
  .note-body th, .note-body td { border: 1px solid #e5e5ea; padding: 8px 12px; text-align: left; }
  .note-body th { background: #f7f7f9; font-weight: 600; }
  .wm { padding: 0 24px 18px; font-size: 12px; color: rgba(0,0,0,.32); text-align: center; letter-spacing: .02em; user-select: none; }
  @media (max-width: 640px) { .note-body { padding: 20px 22px 32px; } .note-head { padding: 22px 22px 16px; } }
</style>
</head>
<body>
<div class="note">
<div class="note-head">
<div class="avatar-lg"><span class="fb">自</span></div>
<div class="note-who"><div class="author">自检</div><div class="time">2026-09-19</div></div>
</div>
<div class="note-body">
<h1>发布链路自检</h1>
<p>这是一次<strong>自动化自检</strong>，验证完会立刻从仓库删除。</p>
<p><img alt="测试图" src="https://chenz821.github.io/preview-pages/images/_selftest_probe.png" /></p>
<p>第二段，确认渲染正常。</p>
</div>
<div class="wm">"@自检"</div>
</div>
</body>
</html>
